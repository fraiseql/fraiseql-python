name: Security Alerts

# Weekly monitoring for new HIGH/CRITICAL vulnerabilities
on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # For creating alert issues

jobs:
  scan-base-images:
    name: Scan Base Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the base image we actually ship. gcr.io/distroless/python3-debian12
      # used to be pulled and scanned here after it had already been dropped from
      # the container-security matrix in security-compliance.yml — so its findings
      # raised alerts for an image nothing builds from. See
      # security-assessment-2025-12-09-distroless.md for that decision.
      - name: Pull latest base image
        run: |
          docker pull python:3.13-slim

      - name: Scan python:3.13-slim
        run: |
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --format json \
            --output /tmp/slim-scan.json \
            --exit-code 0 \
            python:3.13-slim
        continue-on-error: true

      - name: Check for new HIGH/CRITICAL vulnerabilities
        id: check-vulns
        run: |
          # Count HIGH/CRITICAL vulnerabilities
          SLIM_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /tmp/slim-scan.json || echo 0)
          SLIM_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' /tmp/slim-scan.json || echo 0)

          echo "slim_critical=$SLIM_CRITICAL" >> $GITHUB_OUTPUT
          echo "slim_high=$SLIM_HIGH" >> $GITHUB_OUTPUT

          # Determine alert level
          TOTAL_CRITICAL=$SLIM_CRITICAL
          TOTAL_HIGH=$SLIM_HIGH

          if [ "$TOTAL_CRITICAL" -gt 0 ]; then
            echo "alert_level=CRITICAL" >> $GITHUB_OUTPUT
            echo "should_alert=true" >> $GITHUB_OUTPUT
          elif [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "alert_level=HIGH" >> $GITHUB_OUTPUT
            echo "should_alert=true" >> $GITHUB_OUTPUT
          else
            echo "alert_level=NONE" >> $GITHUB_OUTPUT
            echo "should_alert=false" >> $GITHUB_OUTPUT
          fi

          # Generate summary
          cat > /tmp/alert-summary.md <<EOF
          # Base Image Security Alert

          **Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Alert Level**: ${alert_level:-NONE}

          ## python:3.13-slim
          - 🔴 Critical: $SLIM_CRITICAL
          - 🟠 High: $SLIM_HIGH

          ## Action Required
          EOF

          if [ "$TOTAL_CRITICAL" -gt 0 ]; then
            cat >> /tmp/alert-summary.md <<EOF
          ⚠️  **URGENT**: CRITICAL vulnerabilities detected
          - **SLA**: Patch within 24 hours
          - **Action**: Review scan results and update base images immediately
          - **Escalation**: Notify security team and engineering lead
          EOF
          elif [ "$TOTAL_HIGH" -gt 0 ]; then
            cat >> /tmp/alert-summary.md <<EOF
          ⚠️  **Important**: HIGH severity vulnerabilities detected
          - **SLA**: Patch within 7 days
          - **Action**: Review scan results and plan patching
          - **Monitoring**: Track fix availability weekly
          EOF
          else
            cat >> /tmp/alert-summary.md <<EOF
          ✅ **No HIGH or CRITICAL vulnerabilities detected**
          - Continue monitoring weekly
          - Review MEDIUM vulnerabilities in docs/security/vulnerability-remediation-plan.md
          EOF
          fi

          cat /tmp/alert-summary.md

      - name: Upsert rolling base-image vulnerability alert
        if: steps.check-vulns.outputs.should_alert == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // Stable hidden marker used to find the single rolling issue instead
            // of opening a fresh duplicate every weekly run.
            const MARKER = '<!-- security-alerts:base-image-rolling -->';
            const title = '🚨 Base-image vulnerability alert (HIGH/CRITICAL)';
            const alertLevel = '${{ steps.check-vulns.outputs.alert_level }}';
            const summary = fs.readFileSync('/tmp/alert-summary.md', 'utf8');
            const body = `${MARKER}\n\n${summary}`;
            const labels = ['security', 'vulnerability', alertLevel.toLowerCase()];
            const { owner, repo } = context.repo;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body, labels });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `🔄 Refreshed by the weekly base-image scan — current level: **${alertLevel}**. Details updated above.`,
              });
              core.info(`Updated rolling alert #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels });
              core.info(`Created rolling alert #${created.data.number}`);
            }

      - name: Upload scan results
        uses: actions/upload-artifact@v7
        with:
          name: base-image-security-scans
          path: /tmp/*-scan.json

  monitor-active-cves:
    name: Monitor Active CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check CVEs via OSV API
        id: check-cves
        run: |
          WATCHLIST='.github/cve-watchlist.json'
          FIXED_COUNT=0
          REPORT_LINES=""

          while IFS= read -r cve_id; do
            PACKAGE=$(jq -r --arg id "$cve_id" '.monitored_cves[] | select(.id == $id) | .package' "$WATCHLIST")
            RESPONSE=$(curl -s "https://api.osv.dev/v1/vulns/$cve_id")
            # OSV returns 404-style empty or error if CVE is not found (fully fixed/rejected)
            WITHDRAWN=$(echo "$RESPONSE" | jq -r '.withdrawn // empty')
            ALIASES=$(echo "$RESPONSE" | jq -r '.aliases // [] | length')

            if [ -n "$WITHDRAWN" ] || echo "$RESPONSE" | jq -e '.id == null' > /dev/null 2>&1; then
              STATUS="FIXED"
              FIXED_COUNT=$((FIXED_COUNT + 1))
              echo "✅ $cve_id ($PACKAGE) appears resolved"
            else
              STATUS="UNFIXED"
              echo "⏳ $cve_id ($PACKAGE) still active"
            fi

            REPORT_LINES="$REPORT_LINES\n| $cve_id | $PACKAGE | $STATUS |"
          done < <(jq -r '.monitored_cves[].id' "$WATCHLIST")

          echo "fixed_count=$FIXED_COUNT" >> $GITHUB_ENV

          cat > /tmp/cve-monitoring-report.md <<EOF
          # CVE Monitoring Report

          **Report Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Data Source**: OSV API (https://api.osv.dev)

          ## Monitored CVEs Status

          | CVE ID | Component | Status |
          |--------|-----------|--------|
          $(echo -e "$REPORT_LINES")

          ## Actions Required
          EOF

          if [ "$FIXED_COUNT" -eq 0 ]; then
            echo "- ⏳ All CVEs still awaiting patches - continue monitoring" >> /tmp/cve-monitoring-report.md
          else
            cat >> /tmp/cve-monitoring-report.md <<'ACTIONS'
          **Immediate Actions:**
          1. Pull latest base images: `docker pull python:3.13-slim`
          2. Rebuild FraiseQL images
          3. Run Trivy scan to verify fixes
          4. Remove fixed CVEs from .trivyignore
          5. Deploy updated images within 7 days (SLA)
          ACTIONS
          fi

          cat /tmp/cve-monitoring-report.md

      - name: Upsert rolling CVE-patches issue
        if: env.fixed_count > 0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // Stable hidden marker used to find the single rolling issue instead
            // of opening a fresh duplicate every weekly run.
            const MARKER = '<!-- security-alerts:cve-patches-rolling -->';
            const title = 'CVE Patches Available — base-image CVE monitor';
            const report = fs.readFileSync('/tmp/cve-monitoring-report.md', 'utf8');
            const body = `${MARKER}\n\n${report}`;
            const labels = ['security', 'patching', 'cve-monitor'];
            const { owner, repo } = context.repo;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body, labels });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `🔄 Refreshed by the weekly scan — ${process.env.fixed_count} monitored CVE(s) now show fixes. Report updated above.`,
              });
              core.info(`Updated rolling issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels });
              core.info(`Created rolling issue #${created.data.number}`);
            }

      - name: Upload CVE monitoring report
        uses: actions/upload-artifact@v7
        with:
          name: cve-monitoring-report
          path: /tmp/cve-monitoring-report.md

  compliance-summary:
    name: Weekly Compliance Summary
    runs-on: ubuntu-latest
    needs: [scan-base-images, monitor-active-cves]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Generate compliance summary
        run: |
          cat > compliance-summary.md <<EOF
          # Weekly Security Compliance Summary

          **Report Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Compliance Framework**: NIS2 Article 21, NIST 800-53, ISO 27001

          ## Current Security Posture

          ### Container Security
          - Base image scanned for HIGH/CRITICAL vulnerabilities: python:3.13-slim
          - Base image: python:3.13-slim. Distroless was evaluated and rejected —
            see security-assessment-2025-12-09-distroless.md
          - Runtime image carries no curl, no pip and no setuptools
          - Security hardening: Enabled (non-root, read-only filesystem compatible)

          ### Vulnerability Management
          - Accepted risks: Documented in .trivyignore with a justification each
          - Patching SLA: < 7 days for HIGH/CRITICAL
          - Remaining findings are base-OS packages with no upstream fix; the
            per-run counts are in the scan-base-images job, not restated here

          ### Compliance Status
          - ✅ NIS2 Article 21 (Risk Management): Documented risk analysis
          - ✅ NIS2 Article 24 (Vulnerability Database): Weekly monitoring
          - ✅ NIST SI-2 (Flaw Remediation): Automated scanning
          - ✅ ISO 27001 A.12.6.1: Vulnerability tracking

          ## Next Steps
          1. Continue weekly CVE monitoring
          2. Re-evaluate distroless when a Python 3.13 image exists
          3. Implement runtime security monitoring (Falco)
          4. Quarterly penetration testing

          ## Resources
          - Full remediation plan: docs/security/vulnerability-remediation-plan.md
          - Security policy: SECURITY.md
          - Compliance documentation: docs/security-compliance.md
          EOF

          cat compliance-summary.md

      - name: Upload compliance summary
        uses: actions/upload-artifact@v7
        with:
          name: weekly-compliance-summary
          path: compliance-summary.md
