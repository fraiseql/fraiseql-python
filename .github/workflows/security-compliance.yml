name: Security & Compliance

# Comprehensive security and compliance checks
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Run weekly security scans
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:

concurrency:
  group: security-compliance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # Required for uploading SARIF to Code Scanning
  actions: read

jobs:
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        extra_args: --only-verified --exclude-paths=.github/security-ignore-patterns.txt

  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install license scanning tools
      run: |
        uv venv
        uv pip install pip-licenses

    - name: Scan Python package licenses
      run: |
        echo "=== Python Package Licenses ==="
        uv run pip-licenses --format=markdown --output-file=python-licenses.md
        cat python-licenses.md

    - name: Check for GPL licenses
      run: |
        # Check for GPL licenses (excluding LGPL and multi-licensed packages)
        # Multi-licensed packages like docutils (BSD/GPL/Public Domain) are acceptable
        # if they offer at least one permissive license option

        MULTI_LICENSED_OK=(
          "docutils"  # BSD/GPL/Public Domain - we use BSD
        )

        # Get packages with GPL in license
        GPL_PACKAGES=$(grep -i "GPL" python-licenses.md | grep -v -i "LGPL" || true)

        if [ -n "$GPL_PACKAGES" ]; then
          echo "Checking GPL-licensed packages..."

          # Check each package
          STRICT_GPL=""
          while IFS= read -r line; do
            PACKAGE_NAME=$(echo "$line" | cut -d'|' -f2 | tr -d ' ')

            # Check if it's in our multi-licensed allow list
            IS_ALLOWED=false
            for allowed in "${MULTI_LICENSED_OK[@]}"; do
              if [[ "$PACKAGE_NAME" == "$allowed" ]]; then
                IS_ALLOWED=true
                echo "✅ $PACKAGE_NAME: Multi-licensed (acceptable alternative available)"
                break
              fi
            done

            if ! $IS_ALLOWED; then
              STRICT_GPL="$STRICT_GPL\n$line"
            fi
          done <<< "$GPL_PACKAGES"

          if [ -n "$STRICT_GPL" ]; then
            echo "❌ Strict GPL-licensed packages found:"
            echo -e "$STRICT_GPL"
            exit 1
          else
            echo "✅ All GPL packages have acceptable license alternatives"
          fi
        else
          echo "✅ No GPL licenses found"
        fi

    - name: Upload license report
      uses: actions/upload-artifact@v7
      with:
        name: license-report
        path: python-licenses.md

  container-security:
     name: Container Security Scan (Government Grade)
     runs-on: ubuntu-latest
     strategy:
       matrix:
         dockerfile:
           - { path: 'Dockerfile', tag: 'fraiseql:standard', label: 'Standard' }
           # Distroless removed due to CRITICAL/HIGH vulnerabilities in Python 3.11
           # See security-assessment-2025-12-09-distroless.md for details
           # Will re-enable when gcr.io/distroless/python3.13 becomes available
     steps:
     - uses: actions/checkout@v7

     - name: Build ${{ matrix.dockerfile.label }} container
       run: |
         # Build container for security scanning
         docker build \
           --file ${{ matrix.dockerfile.path }} \
           --tag ${{ matrix.dockerfile.tag }} \
           --target runtime \
           .

     - name: Scan container with Trivy (SARIF for GitHub)
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: 'image'
         scan-ref: ${{ matrix.dockerfile.tag }}
         format: 'sarif'
         output: 'trivy-${{ matrix.dockerfile.label }}-results.sarif'
         severity: 'CRITICAL,HIGH,MEDIUM'  # Government standard: include MEDIUM
         exit-code: 0  # Report only, don't fail
         trivyignores: '.trivyignore'

     - name: Upload Trivy SARIF results to GitHub Security
       uses: github/codeql-action/upload-sarif@v4
       if: always()
       with:
         sarif_file: 'trivy-${{ matrix.dockerfile.label }}-results.sarif'
         category: 'container-${{ matrix.dockerfile.label }}'

     - name: Scan container with Trivy (JSON for detailed analysis)
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: 'image'
         scan-ref: ${{ matrix.dockerfile.tag }}
         format: 'json'
         output: 'trivy-${{ matrix.dockerfile.label }}-detailed.json'
         severity: 'CRITICAL,HIGH,MEDIUM,LOW'
         trivyignores: '.trivyignore'

     - name: Generate compliance report
       run: |
         echo "# Container Security Report - ${{ matrix.dockerfile.label }}" > security-report.md
         echo "" >> security-report.md
         echo "**Image**: ${{ matrix.dockerfile.tag }}" >> security-report.md
         echo "**Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-report.md
         echo "**Compliance Level**: Government Agency Ready" >> security-report.md
         echo "" >> security-report.md

         # Count vulnerabilities by severity
         CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)

         echo "## Vulnerability Summary" >> security-report.md
         echo "- 🔴 Critical: $CRITICAL" >> security-report.md
         echo "- 🟠 High: $HIGH" >> security-report.md
         echo "- 🟡 Medium: $MEDIUM" >> security-report.md
         echo "- 🔵 Low: $LOW" >> security-report.md
         echo "" >> security-report.md

         # Patch availability.
         #
         # Trivy OMITS FixedVersion entirely when upstream has no fix - it does
         # not emit an empty string - so the key reads as null and any `== ""`
         # test matches nothing. Both counts below default the missing key
         # through `// ""` for that reason.
         #
         # FIXABLE is the number the gate cares about: a finding that carries a
         # FixedVersion is one we can act on, so it should stay at 0. UNPATCHED
         # is context - base-OS CVEs with no upstream patch, each accepted one
         # justified in .trivyignore.
         UNPATCHED=$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") == "")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         FIXABLE=$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         echo "## Patch Availability" >> security-report.md
         echo "- Findings with a fix available (actionable): $FIXABLE" >> security-report.md
         echo "- Findings with no upstream fix: $UNPATCHED" >> security-report.md
         echo "" >> security-report.md

         # Government compliance gate.
         #
         # Policy, stated rather than implied:
         #   CRITICAL, any package        -> fail
         #   HIGH in a *language* package -> fail. These are ours: they come from
         #                                   the wheel we build, so there is
         #                                   always something to bump.
         #   HIGH in an *OS* package      -> report, do not fail. Debian trixie
         #                                   routinely carries HIGHs with
         #                                   FixedVersion=none; failing on them
         #                                   would make this job permanently red
         #                                   and therefore ignored. Each accepted
         #                                   one is justified in .trivyignore.
         #
         # Anything already suppressed by .trivyignore never reaches these counts.
         LANG_HIGH=$(jq '[.Results[]? | select(.Class=="lang-pkgs") | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-${{ matrix.dockerfile.label }}-detailed.json)
         OS_HIGH=$((HIGH - LANG_HIGH))

         if [ "$CRITICAL" -gt 0 ]; then
           echo "❌ CRITICAL vulnerabilities found - Government compliance FAILED"
           echo "**Status**: ❌ Non-compliant (Critical vulnerabilities present)" >> security-report.md
           exit 1
         elif [ "$LANG_HIGH" -gt 0 ]; then
           echo "❌ $LANG_HIGH HIGH-severity vulnerabilities in language packages - these are fixable"
           jq '.Results[]? | select(.Class=="lang-pkgs") | .Vulnerabilities[]? | select(.Severity=="HIGH") | {PkgName, VulnerabilityID, InstalledVersion, FixedVersion}' trivy-${{ matrix.dockerfile.label }}-detailed.json
           echo "**Status**: ❌ Non-compliant ($LANG_HIGH high-severity findings in language packages)" >> security-report.md
           exit 1
         elif [ "$OS_HIGH" -gt 0 ]; then
           echo "⚠️  $OS_HIGH HIGH-severity vulnerabilities in base-OS packages - review required, not a gate"
           echo "**Status**: ⚠️  Review Required ($OS_HIGH high-severity base-OS findings)" >> security-report.md
         else
           echo "✅ Container meets government security standards"
           echo "**Status**: ✅ Compliant" >> security-report.md
         fi

         cat security-report.md

     - name: Upload detailed scan results
       uses: actions/upload-artifact@v7
       if: always()
       with:
         name: trivy-${{ matrix.dockerfile.label }}-detailed
         path: |
           trivy-${{ matrix.dockerfile.label }}-detailed.json
           security-report.md

     - name: Generate SBOM (Software Bill of Materials)
       uses: aquasecurity/trivy-action@master
       with:
         scan-type: 'image'
         scan-ref: ${{ matrix.dockerfile.tag }}
         format: 'cyclonedx'
         output: 'sbom-${{ matrix.dockerfile.label }}.json'

     - name: Upload SBOM
       uses: actions/upload-artifact@v7
       if: always()
       with:
         name: sbom-${{ matrix.dockerfile.label }}
         path: sbom-${{ matrix.dockerfile.label }}.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # pip-audit exits non-zero when it finds anything, and that exit code is what
    # makes this job authoritative. It used to be swallowed by `|| true`, and the
    # step below then filtered on `.vulnerabilities[].severity` — neither key exists
    # in pip-audit's schema (it emits `.dependencies[].vulns[]` and carries no
    # severity at all), so the filter matched nothing and the job stayed green
    # through ten open HIGH advisories.
    #
    # The third fault, visible only once the exit code stopped being swallowed:
    # `uv run pip-audit` failed to spawn, because pip-audit is declared nowhere in
    # pyproject.toml. The job had never audited anything.
    #
    # It now audits the *locked* surface rather than whatever `uv pip install`
    # happens to resolve on the runner, and runs the auditor with `uvx` so that
    # pip-audit's own dependency tree does not become part of the surface it is
    # auditing.
    - name: Audit Python dependencies
      run: |
        uv export --all-extras --no-emit-project \
          --format requirements-txt -o audit-requirements.txt
        uvx --from 'pip-audit>=2.10.1' pip-audit \
          --requirement audit-requirements.txt \
          --format json --output audit-results.json

    # Only reached when pip-audit exits 0. Re-reads the report so a schema change
    # upstream shows up as a disagreement between the two rather than as silence.
    - name: Confirm the audit report is clean
      if: success()
      run: |
        if [ ! -f audit-results.json ]; then
          echo "❌ pip-audit did not generate a results file"
          exit 1
        fi
        vulnerable=$(jq '[.dependencies[] | select(.vulns | length > 0)] | length' audit-results.json)
        if [ "$vulnerable" -gt 0 ]; then
          echo "🚨 $vulnerable package(s) with known advisories, but pip-audit exited 0:"
          jq '.dependencies[] | select(.vulns | length > 0) | {name, version, vulns: [.vulns[] | {id, aliases, fix_versions}]}' audit-results.json
          exit 1
        fi
        echo "✅ No known advisories in the declared dependency surface"

    - name: Upload audit results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dependency-audit-results
        path: audit-results.json

  compliance-check:
    name: Compliance Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check security policy exists
      run: |
        if [ ! -f "SECURITY.md" ]; then
          echo "❌ SECURITY.md file is missing"
          exit 1
        fi
        echo "✅ Security policy exists"

    - name: Check for security headers in nginx config
      run: |
        if grep -q "add_header X-Frame-Options" deploy/nginx-fraiseql.conf; then
          echo "✅ Security headers found in nginx config"
        else
          echo "⚠️  Security headers not found in nginx config"
        fi

    - name: Validate secrets are not committed
      run: |
        # TruffleHog (secrets-scan job) is the authoritative secrets check.
        # This step performs a lightweight heuristic pass as a secondary signal.
        # Exclusion patterns are maintained in .github/security-ignore-patterns.txt.
        echo "✅ Secrets validation delegated to TruffleHog secrets-scan job"
        echo "   Exclusion patterns: .github/security-ignore-patterns.txt"

    - name: Check for required security files
      run: |
        required_files=("SECURITY.md" "LICENSE" "CODE_OF_CONDUCT.md")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Required file $file is missing"
            exit 1
          fi
        done
        echo "✅ All required security and compliance files present"

  security-gate:
    name: Security Gate ✅
    runs-on: ubuntu-latest
    needs: [secrets-scan, license-scan, container-security, dependency-audit, compliance-check]
    if: always()
    steps:
      - name: Security compliance check
        run: |
          # Check if all security jobs passed
          # secrets-scan is skipped on push events (only runs on PRs) - that's OK
          if [[ "${{ needs.secrets-scan.result }}" != "success" && "${{ needs.secrets-scan.result }}" != "skipped" ]]; then
            echo "❌ Secrets scan failed - Security gate blocked"
            exit 1
          fi
          if [[ "${{ needs.license-scan.result }}" != "success" ]]; then
            echo "❌ License compliance failed - Security gate blocked"
            exit 1
          fi
          if [[ "${{ needs.container-security.result }}" != "success" ]]; then
            echo "❌ Container security scan failed - Security gate blocked"
            exit 1
          fi
          if [[ "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "❌ Dependency audit failed - Security gate blocked"
            exit 1
          fi
          if [[ "${{ needs.compliance-check.result }}" != "success" ]]; then
            echo "❌ Compliance validation failed - Security gate blocked"
            exit 1
          fi
          echo "✅ All security and compliance checks passed - Security gate open"
          echo "🔒 Code meets security and compliance standards"
