# Organization chart queries. Run setup.sql first.

# Everyone under David, at any depth
query AllReports {
  reports(orgPath: "alice.bob.david") {
    name
    title
    orgPath
  }
}

# Only David's direct reports
query DirectReports {
  reports(orgPath: "alice.bob.david", directOnly: true) {
    name
    title
  }
}

# Frank's managers, from the CEO down
query ChainOfCommand {
  chainOfCommand(orgPath: "alice.bob.david.eva.frank") {
    name
    title
    level
  }
}

# The product organization, with fraiseql's where filters
query ProductOrganization {
  employees(where: {orgPath: {descendantOf: "alice.liam"}}) {
    name
    title
  }
}

# Exactly one level below any Eva, with an lquery pattern
query EvasTeam {
  employees(where: {orgPath: {matchesLquery: "*.eva.*{1}"}}) {
    name
  }
}

# The CEO's direct reports, by level
query ExecutiveTeam {
  employees(where: {level: {eq: 2}}) {
    name
    title
    department
  }
}
